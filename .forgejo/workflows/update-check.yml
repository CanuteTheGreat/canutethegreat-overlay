# Daily: ask upstream for the newest release of every package listed in
# .nvchecker/nvchecker.toml and open one issue per new version (deduplicated).
name: update-check
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      selftest_pkg:
        description: "category/package=oldversion: pretend the overlay is that old (opens a real issue, close it afterwards)"
        required: false
        default: ""
jobs:
  check:
    runs-on: colo-light-x86_64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: nvchecker
        env:
          FORGEJO_API: ${{ github.server_url }}/api/v1
          FORGEJO_REPO: ${{ github.repository }}
          SELFTEST_OLD: ${{ inputs.selftest_pkg }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m venv "$RUNNER_TEMP/nv"
          "$RUNNER_TEMP/nv/bin/pip" install -q nvchecker aiohttp
          PATH="$RUNNER_TEMP/nv/bin:$PATH" python3 .ci/update-check.py
