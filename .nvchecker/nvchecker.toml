# nvchecker sources for canutethegreat-overlay. Section name = category/package.

["www-client/brave"]
# source build: newest Brave *release* whose pinned Chromium exists in ::gentoo's www-client/chromium
source = "cmd"
cmd = "python3 .ci/brave-source-latest.py"

["www-client/brave-bin"]
source = "github"
github = "brave/brave-browser"
use_latest_release = true
prefix = "v"

["app-misc/alienfx"]
source = "github"
github = "trackmastersteve/alienfx"
use_latest_release = true
prefix = "v"

["app-forensics/libewf"]
source = "github"
github = "libyal/libewf"
use_max_tag = true
include_regex = '^\d{8}$'

["games-util/geforcenow-electron"]
source = "github"
github = "hmlendea/gfn-electron"
use_latest_release = true
prefix = "v"

["net-fs/goofys-bin"]
source = "github"
github = "kahing/goofys"
use_latest_release = true
prefix = "v"

["net-proxy/zaproxy"]
source = "github"
github = "zaproxy/zaproxy"
use_latest_release = true
prefix = "v"

["net-misc/freedownloadmanager"]
# the unversioned 'latest' .deb is the only download; read its control file
source = "cmd"
cmd = "d=$(mktemp -d) && curl -fsSL -o $d/fdm.deb https://files2.freedownloadmanager.org/6/latest/freedownloadmanager.deb && ar p $d/fdm.deb control.tar.xz | tar xJO ./control | sed -n 's/^Version: //p'; rm -rf $d"
