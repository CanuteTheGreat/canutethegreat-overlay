# nvchecker sources for canutethegreat-overlay. Section name = category/package.

["www-client/brave-bin"]
source = "github"
github = "brave/brave-browser"
use_latest_release = true
prefix = "v"

["app-misc/alienfx"]
source = "github"
github = "trackmastersteve/alienfx"
use_latest_release = true
prefix = "v"

["app-forensics/libewf"]
source = "github"
github = "libyal/libewf"
use_max_tag = true
include_regex = '^\d{8}$'

["games-util/geforcenow-electron"]
source = "github"
github = "hmlendea/gfn-electron"
use_latest_release = true
prefix = "v"

["net-fs/goofys-bin"]
source = "github"
github = "kahing/goofys"
use_latest_release = true
prefix = "v"

["net-proxy/zaproxy"]
source = "github"
github = "zaproxy/zaproxy"
use_latest_release = true
prefix = "v"

["net-misc/freedownloadmanager"]
# the unversioned 'latest' .deb is the only download; read its control file
source = "cmd"
cmd = "d=$(mktemp -d) && curl -fsSL -o $d/fdm.deb https://files2.freedownloadmanager.org/6/latest/freedownloadmanager.deb && ar p $d/fdm.deb control.tar.xz | tar xJO ./control | sed -n 's/^Version: //p'; rm -rf $d"

# Proton apps: official Linux builds, version read from proton.me/download metadata (.ci/proton-latest.py)
["app-admin/proton-pass-bin"]
source = "cmd"
cmd = "python3 .ci/proton-latest.py pass"

["net-im/proton-meet-bin"]
source = "cmd"
cmd = "python3 .ci/proton-latest.py meet"

["sys-auth/proton-authenticator-bin"]
source = "cmd"
cmd = "python3 .ci/proton-latest.py authenticator"

["app-admin/proton-pass-cli-bin"]
source = "cmd"
cmd = "python3 .ci/proton-latest.py pass-cli"

["net-fs/proton-drive-cli-bin"]
source = "cmd"
cmd = "python3 .ci/proton-latest.py drive-cli"

["mail-client/proton-mail-export-bin"]
source = "github"
github = "ProtonMail/proton-mail-export"
use_latest_release = true
prefix = "v"

["media-video/davinci-resolve"]
source = "cmd"
cmd = "python3 .ci/resolve-latest.py"

["net-analyzer/caido-bin"]
source = "cmd"
cmd = "curl -fsSL https://api.caido.io/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"version\"])'"

["net-analyzer/caido-cli-bin"]
source = "cmd"
cmd = "curl -fsSL https://api.caido.io/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)[\"version\"])'"

["dev-embedded/pineflash"]
source = "github"
github = "Spagett1/PineFlash"
use_latest_release = true

["app-misc/qflipper"]
source = "github"
github = "flipperdevices/qFlipper"
use_latest_release = true

["gui-wm/cage"]
source = "github"
github = "cage-kiosk/cage"
use_latest_release = true
prefix = "v"

["dev-db/pgbackrest"]
source = "github"
github = "pgbackrest/pgbackrest"
use_latest_release = true
prefix = "release/"

["net-fs/minio-client"]
source = "github"
github = "minio/mc"
use_latest_release = true
from_pattern = 'RELEASE\.(\d+)-(\d+)-(\d+)T.*'
to_pattern = '\1.\2.\3'

["net-misc/ntfy-bin"]
source = "github"
github = "binwiederhier/ntfy"
use_latest_release = true
prefix = "v"

["www-apps/wp-cli"]
source = "github"
github = "wp-cli/wp-cli"
use_latest_release = true
prefix = "v"

["www-apps/forgejo"]
source = "cmd"
cmd = "curl -s --max-time 30 https://codeberg.org/api/v1/repos/forgejo/forgejo/releases/latest | python3 -c \"import sys,json;print(json.load(sys.stdin)['tag_name'].lstrip('v'))\""

["net-misc/plexmediaserver"]
source = "cmd"
cmd = "curl -s --max-time 30 https://plex.tv/api/downloads/5.json | python3 -c \"import sys,json;print(json.load(sys.stdin)['computer']['Linux']['version'].split('-')[0])\""
