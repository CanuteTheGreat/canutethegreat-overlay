# nvchecker sources for canutethegreat-overlay. Section name = category/package.

["net-analyzer/metasploit-bin"]
source = "apt"
mirror = "https://apt.metasploit.com/"
suite = "lucid"
repo = "main"
pkg = "metasploit-framework"
arch = "amd64"
# 6.5.10~20261106055829~1rapid7-1 -> 6.5.10_p20261106055829 (ebuild PV)
from_pattern = '^(\d+\.\d+\.\d+)~(\d+)~.*'
to_pattern = '\1_p\2'

["app-misc/alienfx"]
source = "github"
github = "trackmastersteve/alienfx"
use_latest_release = true
prefix = "v"

["app-forensics/libewf"]
source = "github"
github = "libyal/libewf"
use_max_tag = true
include_regex = '^\d{8}$'

["games-util/geforcenow-electron"]
