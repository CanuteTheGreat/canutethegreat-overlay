# ETPhoneHome router client (service etphonehome). Shell syntax, sourced by /usr/libexec/etphonehome/etphonehome-run.
# Every key is optional; the value shown is the default. Keep this file mode 0600 (it can hold the pairing token).

# How the phone is reached: usb (phone on a USB port, no USB debugging needed), wifi (needs ETPH_HOST),
# auto (USB when a phone is plugged in, otherwise Wi-Fi when ETPH_HOST is set; chosen on every attempt).
#ETPH_TRANSPORT=usb
# The phone's address / port (Wi-Fi), the app's USB port, the pairing token shown in the ETPH app (Wi-Fi).
#ETPH_HOST=
#ETPH_PORT=
#ETPH_TOKEN=
# TUN interface name for the phone uplink, and its addresses (client defaults: 10.0.0.1/24, peer = next address).
#ETPH_INTERFACE=etph0
#ETPH_TUN_ADDRESS=
#ETPH_TUN_PEER=
# yes: the client adds the default route and DNS when the link is up. no: leave routes to your own scripts / the firewall.
#ETPH_ROUTES=yes
# Run after the link comes up / goes down (arguments up|down; ETPH_IFNAME, ETPH_LOCAL, ETPH_PEER, ... in the environment).
#ETPH_UP_SCRIPT=
#ETPH_DOWN_SCRIPT=
# USB link: auto (accessory link, else adb), aoa or adb. Connection attempts (0 = retry forever).
#ETPH_USB_LINK=auto
#ETPH_MAX_RETRIES=0
# Where the adb identity lives (HOME of the client), the runtime directory and the JSON status file ('' = <run dir>/status.json).
#ETPH_STATE_DIR=/etc/etph
#ETPH_RUN_DIR=/run/etph
#ETPH_STATUS_FILE=
# Log level (RUST_LOG syntax) and extra client options (word-split).
#ETPH_LOG_LEVEL=info
#ETPH_EXTRA=
